name: Insumo Compra Ficha Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_insumo_compra_ficha.py'
      - '.github/workflows/ui-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI fix
        run: python3 .github/scripts/fix_insumo_compra_ficha.py

      - name: Commit corrected index
        run: |
          git config user.name "DDV UI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Separate insumo purchases and fix technical sheet opening"
          git push
