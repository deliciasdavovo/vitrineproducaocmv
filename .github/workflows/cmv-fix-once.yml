name: CMV Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cmv-fix-once.yml'
      - '.github/scripts/cmv_followup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect CMV autocomplete
        run: python3 .github/scripts/cmv_followup.py

      - name: Commit patched index
        run: |
          git config user.name "DDV CMV Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
            exit 0
          fi
          git commit -m "Connect CMV purchase autocomplete"
          git push
